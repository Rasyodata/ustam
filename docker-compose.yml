services:
  postgres:
    image: postgres:16-alpine
    container_name: ustam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustam
      POSTGRES_PASSWORD: ustam_dev_pw
      POSTGRES_DB: ustam
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ustam-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: ustam-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ustam_dev_meili_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - ./docker-data/meili:/meili_data

  minio:
    image: minio/minio:latest
    container_name: ustam-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ustam
      MINIO_ROOT_PASSWORD: ustam_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ustam-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
