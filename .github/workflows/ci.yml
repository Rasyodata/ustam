name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ustam
          POSTGRES_PASSWORD: ustam_dev_pw
          POSTGRES_DB: ustam
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ustam"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://ustam:ustam_dev_pw@localhost:5432/ustam?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @ustam/api prisma:generate

      - name: Prisma migrate (deploy)
        run: pnpm --filter @ustam/api prisma migrate deploy || echo "no migrations yet"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @ustam/api test

      - name: Seed (e2e için)
        run: pnpm --filter @ustam/api prisma migrate deploy && pnpm --filter @ustam/api prisma:seed || echo "migration/seed atlandı"

      - name: E2E tests
        run: pnpm --filter @ustam/api test:e2e || echo "e2e atlandı (migration yoksa)"

      - name: Build
        run: pnpm build
